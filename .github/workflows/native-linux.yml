name: Native Linux build

on:
  workflow_call:
    inputs:
      cuda:
        type: string
        required: true
      archs:
        type: string
        required: true
      runner:
        type: string
        default: ubuntu-24.04
      jobs:
        type: number
        default: 4
      phase:
        description: full (compile, link and package), objects (one shard of the objects) or package
        type: string
        default: full
      shard:
        type: number
        default: 0
      count:
        type: number
        default: 8
      version:
        description: Release tag the binaries report; empty outside publication
        type: string
        default: ''
    secrets:
      HF_BUILD_CACHE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux Debian 13 CUDA ${{ inputs.cuda }} (${{ inputs.archs }})${{ inputs.phase == 'objects' && format(' objects {0}/{1}', inputs.shard, inputs.count) || '' }}
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.runner == 'ubuntu-24.04' && fromJSON('{"image":"debian:13-slim","volumes":["/usr/share/dotnet:/host-tools/dotnet","/usr/local/lib/android:/host-tools/android","/opt/hostedtoolcache:/host-tools/toolcache","/opt/ghc:/host-tools/ghc"]}') || '' }}
    timeout-minutes: 350
    # Each cache family has one writer, including temporary bootstrap runs: a shard writes its own,
    # the package or full build the aggregate. Shard 0 is a false value in an expression, so the
    # group names the shard as a string.
    concurrency:
      group: native-linux-shared-${{ github.ref }}-${{ inputs.cuda }}-${{ inputs.phase == 'objects' && format('shard-{0}', inputs.shard) || 'all' }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      HF_TOKEN: ${{ secrets.HF_BUILD_CACHE_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      NINFER_VERSION: ${{ inputs.version }}
      HF_CACHE_AGGREGATE: native-linux-cuda-${{ inputs.cuda }}-shared-v1
      HF_CACHE_FAMILY: native-linux-cuda-${{ inputs.cuda }}-shared-v1${{ inputs.phase == 'objects' && format('-shard-{0}', inputs.shard) || '' }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/objects
      CCACHE_MAXSIZE: 8Gi
      CCACHE_COMPILERCHECK: content
      CCACHE_DEPEND: "true"
      CCACHE_COMPRESSLEVEL: "5"
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LC_CTYPE: C.UTF-8
      ARCHS: ${{ inputs.archs }}
      CUDA_VERSION: ${{ inputs.cuda }}
    steps:
      - name: Reserve time for cache upload
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "BUILD_DEADLINE=$(( $(date +%s) + 19800 ))" >> "$GITHUB_ENV"
      - name: Free the hosted runner's disk when it is short
        # The runner's preinstalled toolchains, mounted under /host-tools, share the disk with the
        # checkout. A CI job on 12 November had 4.3 GB left when its build started and failed.
        if: inputs.runner == 'ubuntu-24.04'
        run: |
          avail=$(df -B1 --output=avail /__w | tail -1)
          echo "Free disk: $((avail >> 30)) GiB"
          if (( avail < 40 << 30 )); then
            rm -rf /host-tools/*/* || true
            echo "Free disk without the preinstalled toolchains: $(( $(df -B1 --output=avail /__w | tail -1) >> 30 )) GiB"
          fi
      - name: Install checkout tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
      - name: Check the compiler-cache environment
        run: |
          . /etc/os-release
          test "$ID:$VERSION_ID" = debian:13
          test "$GITHUB_WORKSPACE" = /__w/ninfer-all/ninfer-all
      - uses: actions/checkout@v7
      - name: Trust the mounted checkout for subsequent Git commands
        run: |
          # Checkout uses a temporary HOME; packaging uses the container user's HOME.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD
      - name: Install Debian build dependencies and official CUDA Toolkit
        run: .github/scripts/install-linux-release-tools.sh
      - id: compiler-cache
        name: Install pinned object cache
        run: python3.11 .github/scripts/install-compiler-cache.py
      - name: Install HF bucket client
        run: python3.11 -m pip install --disable-pip-version-check huggingface_hub==1.17.0
      - name: Restore completed objects from HF
        id: object-cache
        env:
          PHASE: ${{ inputs.phase }}
          COUNT: ${{ inputs.count }}
        run: |
          # Every phase starts from the aggregate of the last finished build, and on master also from
          # the branch the head commit merged. A shard then adds its own snapshot and later saves
          # only what differs from the aggregate; the package job adds every shard's snapshot.
          restore=(python3.11 .github/scripts/hf-build-cache.py restore --directory .cache/objects --merged-branch)
          if [[ "$PHASE" == objects ]]; then
            "${restore[@]}" --family "$HF_CACHE_AGGREGATE" --baseline build-cache-baseline.tsv
            echo "HF_CACHE_BASELINE=$PWD/build-cache-baseline.tsv" >> "$GITHUB_ENV"
            "${restore[@]}" --family "$HF_CACHE_FAMILY"
          else
            "${restore[@]}" --family "$HF_CACHE_AGGREGATE"
          fi
          if [[ "$PHASE" == package ]]; then
            for (( shard = 0; shard < COUNT; shard++ )); do
              "${restore[@]}" --family "$HF_CACHE_AGGREGATE-shard-$shard" --required
            done
          fi
      - name: Verify object-cache reuse and CUDA invalidation
        timeout-minutes: 10
        run: python3.11 .github/scripts/check-compiler-cache.py
      - name: Configure release products
        run: .github/scripts/configure-linux-build.sh OFF
      - name: Check compiler resource budget
        id: capacity
        run: python3.11 .github/scripts/check-build-capacity.py --jobs ${{ inputs.jobs }}
      - name: Build release products
        id: build
        timeout-minutes: 305
        env:
          PHASE: ${{ inputs.phase }}
          JOBS: ${{ steps.capacity.outputs.jobs }}
        # The rental exposes all host CPUs, beyond its container CPU and RAM quota.
        run: |
          if [[ "$PHASE" == objects ]]; then
            build=(python3.11 .github/scripts/build-object-shard.py --shard ${{ inputs.shard }} --count ${{ inputs.count }} --jobs "$JOBS")
          else
            build=(cmake --build build-release -j "$JOBS" --target ninfer ninfer-serve ninfer_bench ninfer-calibrate ninfer-perplexity ninfer-ngram-profile)
          fi
          python3.11 .github/scripts/run-cached-build.py --timeout-seconds 18000 --deadline-env BUILD_DEADLINE --log build-release/build.log --cache-stats build-release/cache-progress.jsonl -- "${build[@]}"
      - name: Prepare completed object cache for upload
        timeout-minutes: 2
        if: always() && steps.compiler-cache.outcome == 'success'
        # A finished build keeps only the entries it used; an unfinished one keeps the restored rest.
        run: >-
          python3.11 .github/scripts/finish-compiler-cache.py --stats build-release/cache-stats.json
          ${{ steps.build.outcome == 'success' && '--evict-unused-since "$JOB_START"' || '' }}
      - name: Save completed objects even after cancellation
        if: always() && steps.build.outcome != 'skipped' && steps.object-cache.outcome == 'success'
        timeout-minutes: ${{ job.status == 'cancelled' && 3 || 20 }}
        run: python3.11 .github/scripts/hf-build-cache.py save --directory .cache/objects --family "$HF_CACHE_FAMILY"
      - name: Package and verify Linux binaries
        if: inputs.phase != 'objects'
        run: NINFER_BUILD_ROOT="$PWD/build-release" scripts/package-release.sh
      - name: Preserve Linux archive in HF and verify its checksum
        if: inputs.phase != 'objects'
        timeout-minutes: 60
        run: python3.11 .github/scripts/archive-linux-artifact.py
      - uses: actions/upload-artifact@v7
        if: inputs.phase != 'objects'
        with:
          name: native-linux-cuda-${{ inputs.cuda }}
          path: |
            dist/*.tar.gz.*
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-logs-${{ inputs.cuda }}-${{ inputs.phase }}${{ inputs.phase == 'objects' && format('-{0}', inputs.shard) || '' }}
          # .ninja_log holds each compile's start and end; ninja's console lines carry no times.
          include-hidden-files: true
          path: |
            dist/HF-*.json
            build-cache-check/cache-stats.json
            build-release/*.log
            build-release/.ninja_log
            build-release/object-shard.json
            build-release/cache-stats.json
            build-release/cache-progress.jsonl
            build-release/CMakeFiles/CMakeConfigureLog.yaml
            dist/*/BUILD-INFO.json
          if-no-files-found: ignore
          retention-days: 7

