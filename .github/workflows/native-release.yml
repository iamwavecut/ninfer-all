name: Native release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish native release assets and both Docker images (master only)
        type: boolean
        default: false
      platforms:
        description: Platforms to build (publication requires all)
        type: choice
        options: [all, linux, windows]
        default: all
      windows_phase:
        description: Windows phase (package restores all required object shards from HF)
        type: choice
        options: [full, package]
        default: full
      linux_runner:
        description: Linux runner (configured follows the NINFER_LINUX_RUNNER repository variable; the temporary runner must already provide Debian 13)
        type: choice
        options: [configured, github-hosted, ninfer-native-debian13]
        default: configured

permissions:
  contents: read

# Runs of one branch queue: a newer commit waits for the running build, and GitHub drops the
# commit that waited before it. A cancelled build would lose every object it had started; a run
# whose revision is no longer the branch head finishes its objects for the next run and skips
# packaging (the *-current jobs). Publication uses a draft and checks master again before moving
# latest.
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Native inputs changed
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.compare.outputs.native }}
      release_tools: ${{ steps.compare.outputs.release_tools }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/build-inputs.sh --native >> "$GITHUB_OUTPUT"

  checks:
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.release_tools == 'true'
    uses: ./.github/workflows/build-workflow-checks.yml

  validate:
    needs: [changes, checks]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Listing draft releases, whose tags reserve daily numbers, needs write access.
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      linux_runner: ${{ steps.runner.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # A push follows the repository variable NINFER_LINUX_RUNNER, which names a temporary runner
      # while one is registered; a dispatch may choose either runner.
      - name: Choose the Linux runner
        id: runner
        env:
          CHOICE: ${{ inputs.linux_runner || 'configured' }}
          CONFIGURED: ${{ vars.NINFER_LINUX_RUNNER }}
        run: |
          label="$CHOICE"
          [[ "$label" != configured ]] || label="${CONFIGURED:-github-hosted}"
          case "$label" in
            github-hosted|ninfer-native-debian13) echo "label=$label" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown Linux runner: $label" >&2; exit 1 ;;
          esac
      - name: Check publication scope
        env:
          PUBLISH: ${{ inputs.publish }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          if [[ "$PUBLISH" == true && "$PLATFORMS" != all ]]; then
            echo 'Publication requires both Linux and Windows artifacts.' >&2
            exit 1
          fi
      # The binaries report the tag they will be published under; publish checks it again.
      - name: Allocate the release tag
        id: version
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" > release-refs.json
          read -r tag _ < <(python3.11 .github/scripts/native-release-tag.py \
            --releases releases.json --refs release-refs.json --revision "$GITHUB_SHA")
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  windows-objects:
    needs: validate
    if: inputs.platforms != 'linux' && inputs.windows_phase != 'package'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        toolkit:
          - cuda: '12.9.2'
            archs: '70;75;80;86;89'
            packages: '["nvcc", "cudart", "cublas", "cublas_dev", "nvtx", "thrust", "cuda_profiler_api", "cuobjdump", "nvprune"]'
          - cuda: '13.4.3'
            archs: '75;80;86;89;120a'
            packages: '["nvcc", "crt", "nvvm", "cudart", "cublas", "cublas_dev", "nvtx", "thrust", "cuda_profiler_api", "cuobjdump", "nvprune"]'
    uses: ./.github/workflows/native-windows.yml
    with:
      cuda: ${{ matrix.toolkit.cuda }}
      archs: ${{ matrix.toolkit.archs }}
      packages: ${{ matrix.toolkit.packages }}
      phase: objects
      shard: ${{ matrix.shard }}
      version: ${{ needs.validate.outputs.version }}
    secrets:
      HF_BUILD_CACHE_TOKEN: ${{ secrets.HF_BUILD_CACHE_TOKEN }}

  windows-current:
    name: Windows revision still current
    needs: [validate, windows-objects]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && inputs.platforms != 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      superseded: ${{ steps.head.outputs.superseded }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/${GITHUB_REF#refs/heads/}" --jq .object.sha)"
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo superseded=false >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_REF moved to $head; its own run packages it."
            echo superseded=true >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: [validate, windows-objects, windows-current]
    if: >-
      ${{ always() && !cancelled() && needs.validate.result == 'success' &&
          inputs.platforms != 'linux' && needs.windows-current.outputs.superseded == 'false' &&
          (needs.windows-objects.result == 'success' ||
           (inputs.windows_phase == 'package' && needs.windows-objects.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        toolkit:
          - cuda: '12.9.2'
            archs: '70;75;80;86;89'
            packages: '["nvcc", "cudart", "cublas", "cublas_dev", "nvtx", "thrust", "cuda_profiler_api", "cuobjdump", "nvprune"]'
          - cuda: '13.4.3'
            archs: '75;80;86;89;120a'
            packages: '["nvcc", "crt", "nvvm", "cudart", "cublas", "cublas_dev", "nvtx", "thrust", "cuda_profiler_api", "cuobjdump", "nvprune"]'
    uses: ./.github/workflows/native-windows.yml
    with:
      cuda: ${{ matrix.toolkit.cuda }}
      archs: ${{ matrix.toolkit.archs }}
      packages: ${{ matrix.toolkit.packages }}
      phase: package
      version: ${{ needs.validate.outputs.version }}
    secrets:
      HF_BUILD_CACHE_TOKEN: ${{ secrets.HF_BUILD_CACHE_TOKEN }}

  # Hosted runners compile the objects in eight shards per Toolkit, as Windows does; a rented
  # runner (the validate job's linux_runner) compiles, links and packages in one job.
  linux-objects:
    needs: validate
    if: inputs.platforms != 'windows' && needs.validate.outputs.linux_runner != 'ninfer-native-debian13'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        toolkit:
          - cuda: '12.9.2'
            archs: '70;75;80;86;89'
          - cuda: '13.4.3'
            archs: '75;80;86;89;120a'
    uses: ./.github/workflows/native-linux.yml
    with:
      cuda: ${{ matrix.toolkit.cuda }}
      archs: ${{ matrix.toolkit.archs }}
      phase: objects
      shard: ${{ matrix.shard }}
      version: ${{ needs.validate.outputs.version }}
    secrets: inherit

  linux-current:
    name: Linux revision still current
    needs: [validate, linux-objects]
    if: ${{ always() && !cancelled() && needs.validate.result == 'success' && inputs.platforms != 'windows' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      superseded: ${{ steps.head.outputs.superseded }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/${GITHUB_REF#refs/heads/}" --jq .object.sha)"
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo superseded=false >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_REF moved to $head; its own run packages it."
            echo superseded=true >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: [validate, linux-objects, linux-current]
    if: >-
      ${{ always() && !cancelled() && needs.validate.result == 'success' &&
          inputs.platforms != 'windows' && needs.linux-current.outputs.superseded == 'false' &&
          (needs.linux-objects.result == 'success' ||
           (needs.validate.outputs.linux_runner == 'ninfer-native-debian13' && needs.linux-objects.result == 'skipped')) }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - cuda: '12.9.2'
            archs: '70;75;80;86;89'
          - cuda: '13.4.3'
            archs: '75;80;86;89;120a'
    uses: ./.github/workflows/native-linux.yml
    with:
      cuda: ${{ matrix.cuda }}
      archs: ${{ matrix.archs }}
      runner: ${{ needs.validate.outputs.linux_runner == 'ninfer-native-debian13' && 'ninfer-native-debian13' || 'ubuntu-24.04' }}
      jobs: ${{ needs.validate.outputs.linux_runner == 'ninfer-native-debian13' && 32 || 4 }}
      phase: ${{ needs.validate.outputs.linux_runner == 'ninfer-native-debian13' && 'full' || 'package' }}
      version: ${{ needs.validate.outputs.version }}
    secrets: inherit

  universal-linux:
    name: Assemble universal linux package
    needs: linux
    # A rented runner skips the object-shard ancestor.
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Reserve archive space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update && sudo apt-get install -y p7zip-full
      - uses: actions/download-artifact@v8
        with:
          pattern: native-linux-cuda-*
          merge-multiple: true
          path: native-input
      - name: Combine verified backends without compilation
        run: >-
          python3.11 .github/scripts/run-cached-build.py --checkpoint-family=
          --log universal-package.log -- python3.11 scripts/assemble-universal-release.py
          --input native-input --output dist --platform linux-x64 --revision "${{ github.sha }}"
      - name: Preserve universal Linux archive in HF
        env:
          HF_TOKEN: ${{ secrets.HF_BUILD_CACHE_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python3.11 -m pip install --disable-pip-version-check huggingface_hub==1.17.0
          python3.11 .github/scripts/archive-linux-artifact.py
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-universal
          path: |
            dist/*.7z.*
            dist/*.tar.gz.*
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: universal-linux-logs
          path: universal-package.log
          if-no-files-found: ignore

  universal-windows:
    name: Assemble universal windows package
    needs: windows
    # Package-only runs skip the object-shard ancestor.
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Reserve archive space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update && sudo apt-get install -y p7zip-full
      - uses: actions/download-artifact@v8
        with:
          pattern: native-windows-cuda-*
          merge-multiple: true
          path: native-input
      - name: Combine verified backends without compilation
        run: >-
          python3.11 .github/scripts/run-cached-build.py --checkpoint-family=
          --log universal-package.log -- python3.11 scripts/assemble-universal-release.py
          --input native-input --output dist --platform windows-x64 --revision "${{ github.sha }}"
      - uses: actions/upload-artifact@v7
        with:
          name: native-windows-universal
          path: |
            dist/*.7z.*
            dist/*.tar.gz.*
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: universal-windows-logs
          path: universal-package.log
          if-no-files-found: ignore

  containers:
    name: Docker images from Linux artifacts
    needs: linux
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      publish: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.publish) }}

  publish:
    needs: [validate, windows, linux, universal-windows, universal-linux]
    # Package-only runs skip the object-shard ancestor, which the implicit success() would count.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || inputs.publish) &&
          needs.validate.result == 'success' && needs.windows.result == 'success' &&
          needs.linux.result == 'success' && needs.universal-windows.result == 'success' &&
          needs.universal-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Publish verified assets from this commit
        env:
          GH_TOKEN: ${{ github.token }}
          NINFER_VERSION: ${{ needs.validate.outputs.version }}
        run: .github/scripts/publish-native-release.sh
