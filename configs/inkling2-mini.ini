; Inkling 2 Mini UD-IQ4_XS with its vision tower: one request over a 64K-token context, drafted
; by the release's DSpark drafter. Needs 24 GB.
;
; ninfer-serve --config configs/inkling2-mini.ini
;
; docs/recipes.md#inkling-2-mini has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model       = models/Inkling-2-Mini-UD-IQ4_XS-ninfer-v3.ninfer
model-id    = inkling-2-mini
max-context = 65536
vision      = true
