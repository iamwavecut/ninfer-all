; Ternary Bonsai 2 27B on a 24 GB card: adaptive MTP over 198,400 tokens of rk8v4 and a
; 64 GiB disk tier that keeps evicted conversations. Point disk-kv-path at a fast local disk.
;
; ninfer-serve --config configs/bonsai2-27b-disk-tier.ini
;
; docs/recipes.md#ternary-bonsai-2-27b has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model           = models/Ternary-Bonsai-2-27B-ninfer-v3.ninfer
model-id        = bonsai2-27b
max-context     = 198400
kv-capacity     = 198400
kv-dtype        = rk8v4
gdn-state-fp16  = true
spec            = mtp
draft-tokens    = 5
adaptive-mtp    = true
disk-kv-path    = /var/cache/ninfer
disk-kv-gib     = 64
disk-kv-restore = true
