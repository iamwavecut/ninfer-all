; Qwen3.6-35B-A3B NVFP4 on an RTX 50 series card or RTX PRO 6000 (a 120a build): MTP and images
; over 262,144 tokens of rk8v4.
;
; ninfer-serve --config configs/qwen3.6-35b-a3b-nvfp4.ini
;
; docs/recipes.md#qwen36-35b-a3b-nvfp4 has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model          = models/Qwen3.6-35B-A3B-NVFP4-ninfer-v3.ninfer
model-id       = qwen3.6-35b-a3b
max-context    = 262144
kv-capacity    = 262144
kv-dtype       = rk8v4
gdn-state-fp16 = true
spec           = mtp
draft-tokens   = 3
vision         = true
