; Ternary Bonsai 2 27B on a 24 GB card: the fastest single stream, DFlash2 with five drafts
; over the full 262,144-token window of rk8v4.
;
; ninfer-serve --config configs/bonsai2-27b-dflash2.ini
;
; docs/recipes.md#ternary-bonsai-2-27b has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model          = models/Ternary-Bonsai-2-27B-ninfer-v3.ninfer
model-id       = bonsai2-27b
max-context    = 262144
kv-capacity    = 262144
kv-dtype       = rk8v4
gdn-state-fp16 = true
spec           = dflash2
draft-tokens   = 5
