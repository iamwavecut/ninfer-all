; Ternary Bonsai 2 27B: the largest context a 24 GB card holds, 958,464 tokens of rk4v4 with
; YaRN past the native window.
;
; ninfer-serve --config configs/bonsai2-27b-max-context.ini
;
; docs/recipes.md#ternary-bonsai-2-27b has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model          = models/Ternary-Bonsai-2-27B-ninfer-v3.ninfer
model-id       = bonsai2-27b
max-context    = 958464
kv-capacity    = 958464
kv-dtype       = rk4v4
gdn-state-fp16 = true
rope-yarn      = true
