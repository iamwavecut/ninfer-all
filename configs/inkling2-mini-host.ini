; Inkling 2 Mini UD-IQ4_XS on a GPU with less memory than its weights: the routed experts in
; 13.1 GiB of pinned host memory, the most used cached on the GPU, a 32K-token context.
;
; ninfer-serve --config configs/inkling2-mini-host.ini
;
; docs/recipes.md#inkling-2-mini has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model            = models/Inkling-2-Mini-UD-IQ4_XS-ninfer-v3.ninfer
model-id         = inkling-2-mini
max-context      = 32768
expert-residency = host
