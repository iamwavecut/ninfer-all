; Edge0-145B-q3k on one GPU: the experts in 40.1 GB of pinned host memory, the most used of them
; cached on the GPU, drafting with the MTP block.
;
; ninfer-serve --config configs/edge0-145b-q3k-host.ini
;
; docs/recipes.md#edge0-145b-and-edge0-120b has the measurements behind it; docs/edge0.md converts
; the release. Relative paths start in the directory the server runs in; options on the command
; line override these.

model            = models/edge0-145b-q3k.ninfer
ngram-table      = models/edge0-ple-fp8-table.ninfer
model-id         = edge0-145b
max-context      = 32768
expert-residency = host
