; Gemma 4 26B-A4B (QAT Q4_0 with its MTP assistant and vision tower): four concurrent requests
; over 40K-token contexts, two drafts a round, images and video. Needs 16 GB or more.
;
; ninfer-serve --config configs/gemma4-26b-a4b.ini
;
; docs/recipes.md#gemma-4-26b-a4b has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model           = models/gemma-4-26B-A4B-it-QAT-Q4_0-MTP-ninfer-v3.ninfer
model-id        = gemma4
max-context     = 40960
max-concurrency = 4
spec            = mtp
draft-tokens    = 2
vision          = true
