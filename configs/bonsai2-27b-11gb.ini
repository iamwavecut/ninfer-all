; Ternary Bonsai 2 27B on an 11 GB card (RTX 2080 Ti): 143,360 tokens of rk4v4 with MTP.
; Without spec and draft-tokens the card holds 200,704 tokens.
;
; ninfer-serve --config configs/bonsai2-27b-11gb.ini
;
; docs/recipes.md#cards-of-8-to-12-gb has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model          = models/Ternary-Bonsai-2-27B-ninfer-v3.ninfer
model-id       = bonsai2-27b
max-context    = 143360
kv-capacity    = 143360
kv-dtype       = rk4v4
gdn-state-fp16 = true
spec           = mtp
draft-tokens   = 3
