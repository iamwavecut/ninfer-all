; Edge0-120B-q3k with every expert on one 48 GB GPU and the n-gram table read from its file. One
; request at a time drafts with the MTP block by default.
;
; ninfer-serve --config configs/edge0-120b-q3k-device.ini
;
; docs/recipes.md#edge0-145b-and-edge0-120b downloads the files and has the measurements behind
; it. Relative paths start in the directory the server runs in; options on the command
; line override these.

model       = models/Edge0-120B-q3k-ninfer-v3.ninfer
ngram-table = models/Edge0-ngram-table-FP8-ninfer-v3.ninfer
model-id    = edge0-120b
max-context = 32768
