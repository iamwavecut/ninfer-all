; Edge0-120B-q3k with every expert on one 48 GB GPU and the n-gram table read from its file. One
; request at a time drafts with the MTP block by default.
;
; ninfer-serve --config configs/edge0-120b-q3k-device.ini
;
; docs/recipes.md#edge0-145b-and-edge0-120b has the measurements behind it; docs/edge0.md converts
; the release. Relative paths start in the directory the server runs in; options on the command
; line override these.

model       = models/edge0-120b-q3k.ninfer
ngram-table = models/edge0-ple-fp8-table.ninfer
model-id    = edge0-120b
max-context = 32768
