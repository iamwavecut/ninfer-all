; Ternary Bonsai 2.5 27B PTQ1_0: the largest context a 24 GB card holds, 1,019,904 tokens of rk4v4
; with YaRN past the native window.
;
; ninfer-serve --config configs/bonsai2.5-27b-max-context.ini
;
; docs/recipes.md#ternary-bonsai-25-27b has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model          = models/Ternary-Bonsai-2.5-27B-PTQ1_0-ninfer-v3.ninfer
model-id       = bonsai2.5-27b
max-context    = 1019904
kv-capacity    = 1019904
kv-dtype       = rk4v4
gdn-state-fp16 = true
rope-yarn      = true
