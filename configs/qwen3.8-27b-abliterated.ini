; Huihui Qwen3.8-27B abliterated on one RTX 3090: 198,400 tokens of rk8v4 with MTP and
; images; the image encode borrows device memory.
;
; ninfer-serve --config configs/qwen3.8-27b-abliterated.ini
;
; docs/recipes.md#qwen38-27b-fine-tunes has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model             = models/Huihui-Qwen3.8-27B-abliterated-ninfer-v3.ninfer
model-id          = qwen3.8-27b
max-context       = 198400
kv-capacity       = 198400
kv-dtype          = rk8v4
gdn-state-fp16    = true
spec              = mtp
draft-tokens      = 3
vision            = true
vision-residency  = overlay
vision-max-merged = 12288
