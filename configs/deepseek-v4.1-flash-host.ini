; DeepSeek-V4.1-Flash IQ1_M on one GPU with room to pin 106.7 GiB of host memory: the experts
; in RAM, the most used cached on the GPU, two concurrent requests.
;
; ninfer-serve --config configs/deepseek-v4.1-flash-host.ini
;
; docs/recipes.md#deepseek-v41-flash has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model            = models/DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ1_M-ninfer-v3.ninfer
ngram-table      = models/DeepSeek-V4.1-Flash-Engram-IQ4_NL-ninfer-v3.ninfer
model-id         = deepseek-v4.1-flash
max-context      = 32768
max-concurrency  = 2
expert-residency = host
