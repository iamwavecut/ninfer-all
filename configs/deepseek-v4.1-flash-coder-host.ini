; ISTA-DASLab's expert-pruned DeepSeek-V4.1-Flash Coder: its experts in 61.5 GiB of pinned host
; memory, the Engram table shared with the full model.
;
; ninfer-serve --config configs/deepseek-v4.1-flash-coder-host.ini
;
; docs/recipes.md#deepseek-v41-flash has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model            = models/DeepSeek-V4.1-Flash-1017-GSQ-RCO-Coder-IQ2_XXS-ninfer-v3.ninfer
ngram-table      = models/DeepSeek-V4.1-Flash-Engram-IQ4_NL-ninfer-v3.ninfer
model-id         = deepseek-v4.1-flash-coder
max-context      = 32768
expert-residency = host
