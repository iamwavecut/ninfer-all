; Flint UD-Q4_K_XL on a 16 or 24 GB GPU: the experts in 21.5 GiB of pinned host memory, the most
; used cached on the GPU.
;
; ninfer-serve --config configs/flint-host.ini
;
; docs/recipes.md#flint has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model            = models/flint-UD-Q4_K_XL-ninfer-v3.ninfer
model-id         = flint
max-context      = 65536
expert-residency = host
