; Qwen3.8-Flash-Next Q2_0 on one GPU of 8 GB or more and little RAM: the experts stay in the
; file and stream into a GPU cache.
;
; ninfer-serve --config configs/qwen3.8-flash-next-disk.ini
;
; docs/recipes.md#qwen38-flash-next has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model            = models/Qwen3.8-Flash-Next-GSQ-RCO-Q2_0-ninfer-v3.ninfer
ngram-table      = models/Qwen3.8-Flash-Next-ngram-table-IQ4_NL-ninfer-v3.ninfer
model-id         = qwen3.8-flash-next
max-context      = 32768
expert-residency = disk
