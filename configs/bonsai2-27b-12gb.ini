; Ternary Bonsai 2 27B on a 12 GB card (RTX 3060): 266,240 tokens of rk4v4.
;
; ninfer-serve --config configs/bonsai2-27b-12gb.ini
;
; docs/recipes.md#cards-of-8-to-12-gb has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model          = models/Ternary-Bonsai-2-27B-ninfer-v3.ninfer
model-id       = bonsai2-27b
max-context    = 266240
kv-capacity    = 266240
kv-dtype       = rk4v4
gdn-state-fp16 = true
