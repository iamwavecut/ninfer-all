; The official Qwen3.8-27B artifact on a 24 GB card: DFlash2 with five drafts over 245,760
; tokens of rk4v4.
;
; ninfer-serve --config configs/qwen3.8-27b-dflash2.ini
;
; docs/recipes.md#qwen38-27b has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model          = models/qwen3_8_27b.ninfer
model-id       = qwen3.8-27b
max-context    = 245760
kv-capacity    = 245760
kv-dtype       = rk4v4
gdn-state-fp16 = true
spec           = dflash2
draft-tokens   = 5
