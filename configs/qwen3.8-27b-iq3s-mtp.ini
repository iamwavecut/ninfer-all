; Qwen3.8-27B GSQ-RCO IQ3_S on a 24 GB card: MTP over 176,128 tokens of rk8v4.
;
; ninfer-serve --config configs/qwen3.8-27b-iq3s-mtp.ini
;
; docs/recipes.md#qwen38-27b has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model          = models/Qwen3.8-27B-GSQ-RCO-IQ3_S-ninfer-v3.ninfer
model-id       = qwen3.8-27b
max-context    = 176128
kv-capacity    = 176128
kv-dtype       = rk8v4
gdn-state-fp16 = true
spec           = mtp
draft-tokens   = 3
