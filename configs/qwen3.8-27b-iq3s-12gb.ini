; Qwen3.8-27B GSQ-RCO IQ3_S on a 12 GB card: 8,192 tokens of rk4v4 and no drafter.
;
; ninfer-serve --config configs/qwen3.8-27b-iq3s-12gb.ini
;
; docs/recipes.md#cards-of-8-to-12-gb has the measurements behind it. Relative paths start in the
; directory the server runs in; options on the command line override these.

model          = models/Qwen3.8-27B-GSQ-RCO-IQ3_S-ninfer-v3.ninfer
model-id       = qwen3.8-27b
max-context    = 8192
kv-capacity    = 8192
kv-dtype       = rk4v4
gdn-state-fp16 = true
