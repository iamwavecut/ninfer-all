; Edge0-145B-NVFP4 on one GPU with little RAM: the experts stay in the artifact's file and stream
; into a GPU cache.
;
; ninfer-serve --config configs/edge0-145b-nvfp4-disk.ini
;
; docs/recipes.md#edge0-145b-and-edge0-120b has the measurements behind it; docs/edge0.md converts
; the release. Relative paths start in the directory the server runs in; options on the command
; line override these.

model            = models/edge0-145b-nvfp4.ninfer
ngram-table      = models/edge0-ple-fp8-table.ninfer
model-id         = edge0-145b
max-context      = 32768
expert-residency = disk
